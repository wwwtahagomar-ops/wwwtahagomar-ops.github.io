<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیگنال‌یاب - نسخه پایدار</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma,Arial,sans-serif; }
        body { background:#0b0e11; color:#d1d4dc; padding:15px; min-height:100vh; }
        .container { max-width:1400px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:8px; }
        .header h1 { font-size:18px; color:#f0f0f0; }
        .header .status { font-size:12px; color:#7b8a9b; }
        .header .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:5px; }
        .dot.green { background:#00c805; }
        .timeframes { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; background:#1e2329; padding:6px 10px; border-radius:8px; }
        .timeframes button { background:transparent; border:1px solid #2b3139; color:#8b9aa8; padding:3px 10px; border-radius:4px; cursor:pointer; font-size:11px; }
        .timeframes button.active { background:#2b3139; color:#f0f0f0; border-color:#f0b90b; }
        .chart-container { background:#131a20; border-radius:12px; padding:8px; margin-bottom:15px; height:340px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .chart-container canvas { width:100% !important; height:100% !important; border-radius:6px; background:#0f141a; }
        .panels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px; }
        .panel { background:#131a20; border-radius:8px; padding:10px; border:1px solid #1e2329; }
        .panel h3 { font-size:12px; color:#8b9aa8; margin-bottom:8px; border-bottom:1px solid #1e2329; padding-bottom:5px; }
        .panel .signal-item { background:#1e2329; padding:6px 8px; border-radius:4px; margin-bottom:4px; font-size:11px; border-right:3px solid #f0b90b; }
        .panel .signal-item .symbol { font-weight:bold; color:#f0f0f0; }
        .panel .signal-item .type { display:inline-block; padding:1px 6px; border-radius:3px; font-size:9px; margin-right:4px; }
        .type.long { background:#00c80522; color:#00c805; }
        .type.short { background:#f2364522; color:#f23645; }
        .panel .condition { font-size:11px; color:#b7bdc6; padding:2px 0; }
        .panel .condition .highlight { color:#f0b90b; }
        .trade-btns { display:flex; gap:6px; margin-top:6px; }
        .trade-btns button { flex:1; padding:6px; border:none; border-radius:4px; font-weight:bold; font-size:12px; cursor:pointer; }
        .trade-btns .btn-long { background:#00c805; color:#fff; }
        .trade-btns .btn-short { background:#f23645; color:#fff; }
        .manual-signal { margin-top:8px; display:flex; gap:5px; flex-wrap:wrap; }
        .manual-signal input { flex:1; padding:5px 8px; border-radius:4px; border:1px solid #2b3139; background:#1e2329; color:#d1d4dc; font-size:11px; min-width:60px; }
        .manual-signal button { padding:5px 12px; border:none; border-radius:4px; background:#2b3139; color:#d1d4dc; cursor:pointer; font-size:11px; }
        .history { background:#131a20; border-radius:8px; padding:10px; border:1px solid #1e2329; }
        .history h3 { font-size:12px; color:#8b9aa8; margin-bottom:8px; border-bottom:1px solid #1e2329; padding-bottom:5px; }
        .history-list { max-height:100px; overflow-y:auto; }
        .history-list::-webkit-scrollbar { width:3px; }
        .history-list::-webkit-scrollbar-track { background:#1e2329; }
        .history-list::-webkit-scrollbar-thumb { background:#2b3139; border-radius:3px; }
        .history-item { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #1a1f26; font-size:11px; flex-wrap:wrap; }
        .history-item .h-time { color:#6a7a8b; font-size:10px; }
        .history-item .h-symbol { font-weight:bold; color:#f0f0f0; }
        @media (max-width:900px) { .panels { grid-template-columns:1fr; } .chart-container { height:240px; } }
        @media (max-width:600px) { .timeframes button { font-size:9px; padding:2px 6px; } .header h1 { font-size:15px; } }
        .source-badge { font-size:9px; color:#5a6a7b; margin-top:2px; text-align:center; }
        .data-source { color:#f0b90b; font-weight:bold; }
        .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#00c805; animation: blink 1s infinite; margin-right:3px; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .ai-chat { position:fixed; bottom:20px; right:20px; width:320px; max-width:90vw; background:#131a20; border:1px solid #2b3139; border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,0.8); z-index:999; display:none; flex-direction:column; max-height:450px; overflow:hidden; }
        .ai-chat.open { display:flex; }
        .ai-chat-header { background:#1e2329; padding:8px 12px; border-bottom:1px solid #2b3139; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
        .ai-chat-header h4 { color:#f0b90b; font-size:13px; }
        .ai-chat-header button { background:none; border:none; color:#8b9aa8; font-size:16px; cursor:pointer; }
        .ai-chat-body { padding:8px 12px; overflow-y:auto; flex:1; max-height:250px; min-height:120px; }
        .ai-chat-body .msg { margin-bottom:6px; padding:6px 10px; border-radius:6px; font-size:12px; line-height:1.5; max-width:85%; }
        .ai-chat-body .msg.user { background:#1e2329; color:#d1d4dc; margin-right:auto; border-left:3px solid #f0b90b; }
        .ai-chat-body .msg.ai { background:#0f141a; color:#d1d4dc; margin-left:auto; border-right:3px solid #42a5f5; }
        .ai-chat-body .msg.ai .label { font-size:9px; color:#42a5f5; display:block; margin-bottom:2px; }
        .ai-chat-footer { border-top:1px solid #2b3139; padding:6px 8px; display:flex; gap:5px; }
        .ai-chat-footer input { flex:1; padding:5px 8px; border-radius:4px; border:1px solid #2b3139; background:#1e2329; color:#d1d4dc; font-size:11px; }
        .ai-chat-footer button { padding:5px 12px; border:none; border-radius:4px; background:#f0b90b; color:#0b0e11; font-weight:bold; cursor:pointer; font-size:11px; }
        .ai-toggle-btn { position:fixed; bottom:20px; right:20px; background:#f0b90b; color:#0b0e11; border:none; border-radius:50%; width:48px; height:48px; font-size:24px; cursor:pointer; box-shadow:0 4px 16px rgba(240,185,11,0.4); z-index:998; transition:transform 0.2s; }
        .ai-toggle-btn:hover { transform:scale(1.05); }
        .ai-toggle-btn.hidden { display:none; }
    </style>
</head>

<script>
    // ============================================================
    // نسخه فوق‌پایدار - بدون async/await - بدون fetch
    // ============================================================
    
    // تنظیمات
    var CONFIG = {
        telegramToken: '8989455592:AAGvC-ow7mvksnrsMaBIcfpHhjzJ7fSRymE',
        telegramChatId: '5823510090',
        scanInterval: 5000,
        symbols: ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT', 'ADAUSDT']
    };

    var currentSymbol = 'BTCUSDT';
    var currentTF = '15m';
    var scanTimer = null;
    var history = [];
    var lastEMA50 = null;
    var lastEMA200 = null;
    var lastPrice = null;
    var lastSignal = null;
    var updateCount = 0;
    var globalPrice = 65000;
    var globalTrend = 0;

    // ============================================================
    // داده‌های شبیه‌سازی
    // ============================================================
    function generateMockData(limit, basePrice) {
        if (basePrice === undefined) basePrice = globalPrice;
        var data = [];
        var price = basePrice;
        globalTrend = globalTrend + (Math.random() - 0.5) * 0.0005;
        if (globalTrend > 0.003) globalTrend = 0.003;
        if (globalTrend < -0.003) globalTrend = -0.003;
        
        for (var i = 0; i < limit; i++) {
            var change = (Math.random() - 0.5 + globalTrend) * price * 0.003;
            price = price + change;
            if (price < basePrice * 0.75) price = basePrice * 0.75;
            if (price > basePrice * 1.25) price = basePrice * 1.25;
            data.push({
                time: Date.now() - (limit - i) * 60000,
                open: price,
                high: price + Math.random() * price * 0.002,
                low: price - Math.random() * price * 0.002,
                close: price + (Math.random() - 0.5) * price * 0.002
            });
        }
        globalPrice = price;
        return data;
    }

    var basePrices = {
        'BTCUSDT': 65000,
        'ETHUSDT': 3500,
        'BNBUSDT': 600,
        'SOLUSDT': 180,
        'XRPUSDT': 0.5,
        'ADAUSDT': 0.4
    };

    function fetchKlines(symbol, interval, limit) {
        if (limit === undefined) limit = 200;
        var base = basePrices[symbol];
        if (base === undefined) base = 50000;
        return generateMockData(limit, base);
    }

    function getCurrentPrice(symbol) {
        return globalPrice;
    }

    // ============================================================
    // محاسبه EMA
    // ============================================================
    function calculateEMA(data, period) {
        var ema = [];
        var multiplier = 2 / (period + 1);
        var sum = 0;
        for (var i = 0; i < data.length; i++) {
            if (i < period - 1) {
                sum = sum + data[i].close;
                ema.push(null);
            } else if (i === period - 1) {
                sum = sum + data[i].close;
                ema.push(sum / period);
            } else {
                var val = (data[i].close - ema[i-1]) * multiplier + ema[i-1];
                ema.push(val);
            }
        }
        return ema;
    }

    // ============================================================
    // استراتژی
    // ============================================================
    function checkStrategy(klines1h, klines30m, klines15m) {
        if (!klines1h || !klines30m || !klines15m || klines1h.length < 50) {
            return { signal: null, reason: 'داده کافی نیست' };
        }
        var ema50_1h = calculateEMA(klines1h, 50);
        var ema200_1h = calculateEMA(klines1h, 200);
        var ema50_30m = calculateEMA(klines30m, 50);
        var ema200_30m = calculateEMA(klines30m, 200);
        var ema50_15m = calculateEMA(klines15m, 50);
        
        var last1h = klines1h[klines1h.length - 1];
        var last30m = klines30m[klines30m.length - 1];
        var last15m = klines15m[klines15m.length - 1];
        
        var b1 = last1h.close > ema50_1h[ema50_1h.length - 1] && last1h.close > ema200_1h[ema200_1h.length - 1];
        var b2 = last30m.close > ema50_30m[ema50_30m.length - 1] && last30m.close > ema200_30m[ema200_30m.length - 1];
        var pLong = last15m.low <= ema50_15m[ema50_15m.length - 1] && last15m.close > ema50_15m[ema50_15m.length - 1];
        
        var s1 = last1h.close < ema50_1h[ema50_1h.length - 1] && last1h.close < ema200_1h[ema200_1h.length - 1];
        var s2 = last30m.close < ema50_30m[ema50_30m.length - 1] && last30m.close < ema200_30m[ema200_30m.length - 1];
        var pShort = last15m.high >= ema50_15m[ema50_15m.length - 1] && last15m.close < ema50_15m[ema50_15m.length - 1];
        
        if (b1 && b2 && pLong) {
            return { signal: 'long', reason: 'روند صعودی 1h/30m + پول‌بک به EMA50' };
        }
        if (s1 && s2 && pShort) {
            return { signal: 'short', reason: 'روند نزولی 1h/30m + پول‌بک به EMA50' };
        }
        return { signal: null, reason: 'شرایط ورود محقق نشد' };
    }

    // ============================================================
    // رسم نمودار با Canvas
    // ============================================================
    function drawChart(data, ema50, ema200) {
        var container = document.getElementById('chartContainer');
        container.innerHTML = '<canvas id="chartCanvas"></canvas><div class="source-badge">📡 منبع: <span class="data-source">شبیه‌سازی</span> | ⏱ ' + new Date().toLocaleTimeString('fa-IR') + '</div>';
        var canvas = document.getElementById('chartCanvas');
        var rect = container.getBoundingClientRect();
        canvas.width = rect.width || 300;
        canvas.height = (rect.height || 240) - 20;
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        
        if (!data || data.length < 2) {
            ctx.fillStyle = '#6a7a8b';
            ctx.font = '14px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('داده‌ای موجود نیست', w/2, h/2);
            return;
        }

        var allValues = [];
        for (var i = 0; i < data.length; i++) {
            allValues.push(data[i].high);
            allValues.push(data[i].low);
        }
        for (var j = 0; j < ema50.length; j++) {
            if (ema50[j] !== null) allValues.push(ema50[j]);
        }
        for (var k = 0; k < ema200.length; k++) {
            if (ema200[k] !== null) allValues.push(ema200[k]);
        }
        var min = Math.min.apply(null, allValues);
        var max = Math.max.apply(null, allValues);
        var range = max - min || 1;
        var pad = 15;
        var candleWidth = Math.min((w - pad * 2) / data.length * 0.7, 6);
        var xStep = (w - pad * 2) / data.length;

        function getY(val) {
            return pad + (h - pad * 2) * (1 - (val - min) / range);
        }

        // رسم کندل‌ها
        for (var m = 0; m < data.length; m++) {
            var c = data[m];
            var x = pad + m * xStep + (xStep - candleWidth) / 2;
            var yOpen = getY(c.open);
            var yClose = getY(c.close);
            var yHigh = getY(c.high);
            var yLow = getY(c.low);
            var isGreen = c.close >= c.open;
            
            ctx.fillStyle = isGreen ? '#0f0' : '#f33';
            ctx.strokeStyle = isGreen ? '#0f0' : '#f33';
            ctx.lineWidth = 1;
            
            var bodyTop = Math.min(yOpen, yClose);
            var bodyHeight = Math.max(Math.abs(yClose - yOpen), 1);
            ctx.fillRect(x, bodyTop, candleWidth, bodyHeight);
            
            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, yHigh);
            ctx.lineTo(x + candleWidth / 2, yLow);
            ctx.stroke();
        }

        // EMA50
        if (ema50.length > 10) {
            ctx.beginPath();
            ctx.strokeStyle = '#42a5f5';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            var started = false;
            for (var n = 0; n < ema50.length; n++) {
                if (ema50[n] === null) { started = false; continue; }
                var x1 = pad + n * xStep + candleWidth / 2;
                var y1 = getY(ema50[n]);
                if (!started) { ctx.moveTo(x1, y1); started = true; }
                else ctx.lineTo(x1, y1);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // EMA200
        if (ema200.length > 10) {
            ctx.beginPath();
            ctx.strokeStyle = '#ff9800';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            var started2 = false;
            for (var p = 0; p < ema200.length; p++) {
                if (ema200[p] === null) { started2 = false; continue; }
                var x2 = pad + p * xStep + candleWidth / 2;
                var y2 = getY(ema200[p]);
                if (!started2) { ctx.moveTo(x2, y2); started2 = true; }
                else ctx.lineTo(x2, y2);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // برچسب‌ها
        ctx.fillStyle = '#5a6a7b';
        ctx.font = '9px Tahoma';
        ctx.textAlign = 'center';
        var step = Math.max(1, Math.floor(data.length / 8));
        for (var q = 0; q < data.length; q += step) {
            var x3 = pad + q * xStep + candleWidth / 2;
            ctx.fillText(new Date(data[q].time).toLocaleTimeString('fa-IR'), x3, h - 2);
        }
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(max).toString(), w - 4, pad + 10);
        ctx.fillText(Math.round(min).toString(), w - 4, h - pad + 2);
    }

    // ============================================================
    // تلگرام
    // ============================================================
    function sendTelegram(message) {
        try {
            var url = 'https://api.telegram.org/bot' + CONFIG.telegramToken + '/sendMessage';
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify({
                chat_id: CONFIG.telegramChatId,
                text: message,
                parse_mode: 'Markdown'
            }));
        } catch(e) {
            console.log('تلگرام خطا:', e);
        }
    }

    function addHistory(symbol, type, price) {
        var now = new Date().toLocaleString('fa-IR');
        history
